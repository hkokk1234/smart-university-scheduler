spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: smart-university-scheduler
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  # Optional local file; environment variables override it. Run from backend/.
  config:
    import: optional:file:../.env[.properties]
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${DB_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-migration-naming: true

server:
  port: ${BACKEND_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  level:
    root: ${LOG_LEVEL:INFO}

security:
  jwt:
    secret-base64: ${JWT_SECRET_BASE64:}
    issuer: ${JWT_ISSUER:smart-university-scheduler}
    audience: ${JWT_AUDIENCE:smart-university-scheduler-api}
    ttl-seconds: ${JWT_TTL_SECONDS:900}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}
    persist-authorization: false

scheduler:
  solver:
    max-time-millis: ${SOLVER_MAX_TIME_MILLIS:3000}
    max-groups: ${SOLVER_MAX_GROUPS:100}
    max-options: ${SOLVER_MAX_OPTIONS:5000}

copilot:
  enabled: ${AI_ENABLED:false}
  api-key: ${OPENAI_API_KEY:}
  model: ${AI_MODEL:gpt-4o-mini}
